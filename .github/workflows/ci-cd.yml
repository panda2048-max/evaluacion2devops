name: CI/CD ms-vehiculos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimo privilegio por defecto; cada job pide solo lo que necesita
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la ejecucion anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: ms-vehiculos
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ms-vehiculos
  JAVA_VERSION: "21"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Seguridad: analisis de codigo con SonarQube Cloud (Quality Gate) y
  #    escaneo de dependencias con OSV-Scanner. Si el Quality Gate falla o hay
  #    dependencias vulnerables, el job falla y BLOQUEA la imagen y el despliegue.
  #    (Las pruebas unitarias siguen en el proyecto y se ejecutan con ./mvnw verify,
  #    pero no forman parte del pipeline.)
  # ---------------------------------------------------------------------------
  security:
    name: 1. Seguridad (SonarQube + dependencias)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || github.repository_owner }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # SonarQube usa el historial git para detectar el "codigo nuevo"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache de SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Verificar que existe el secret SONAR_TOKEN
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Falta el secret SONAR_TOKEN (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      # Compila (sin ejecutar pruebas) y envia el analisis a SonarQube Cloud.
      # Como las pruebas no corren en el pipeline, la cobertura se excluye del analisis.
      - name: Analisis de codigo (SonarQube Cloud)
        run: |
          chmod +x mvnw
          ./mvnw -B test-compile org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.projectName=ms-vehiculos \
            -Dsonar.coverage.exclusions="**/*"

      # Bloqueo: espera a que SonarQube procese el analisis y consulta el Quality Gate.
      #   OK    -> continua
      #   ERROR -> el pipeline se detiene (no se construye ni despliega la imagen)
      #   NONE  -> primer analisis del proyecto: aun no hay "codigo nuevo" con que comparar,
      #            se deja pasar con una advertencia
      - name: Verificar Quality Gate
        run: |
          AUTH="Authorization: Bearer $SONAR_TOKEN"
          TASK_ID=$(grep '^ceTaskId=' target/sonar/report-task.txt | cut -d= -f2)

          for i in $(seq 1 60); do
            TASK=$(curl -fsS -H "$AUTH" "https://sonarcloud.io/api/ce/task?id=$TASK_ID")
            STATUS=$(echo "$TASK" | jq -r .task.status)
            case "$STATUS" in
              SUCCESS) break ;;
              FAILED|CANCELED) echo "::error::SonarQube no pudo procesar el analisis ($STATUS)"; exit 1 ;;
            esac
            sleep 5
          done
          [ "$STATUS" = "SUCCESS" ] || { echo "::error::Tiempo de espera agotado esperando a SonarQube"; exit 1; }

          ANALYSIS_ID=$(echo "$TASK" | jq -r .task.analysisId)
          GATE=$(curl -fsS -H "$AUTH" "https://sonarcloud.io/api/qualitygates/project_status?analysisId=$ANALYSIS_ID")
          QG=$(echo "$GATE" | jq -r .projectStatus.status)
          echo "Quality Gate: $QG"
          echo "$GATE" | jq -r '.projectStatus.conditions[]? | "- \(.metricKey): \(.actualValue) (\(.status))"'

          {
            echo "## Analisis de codigo (SonarQube Cloud)"
            echo "- Quality Gate: **$QG**"
            echo "- Reporte: https://sonarcloud.io/summary/overall?id=${SONAR_PROJECT_KEY}"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$QG" in
            OK)    echo "Quality Gate aprobado" ;;
            NONE)  echo "::warning::Quality Gate no calculado (primer analisis del proyecto, sin linea base de codigo nuevo)" ;;
            *)     echo "::error::Quality Gate NO aprobado ($QG). Revisar el reporte en SonarQube Cloud."; exit 1 ;;
          esac

      # Escaneo de dependencias (incluye transitivas) contra la base de datos OSV.
      # Falla si encuentra vulnerabilidades conocidas; las excepciones justificadas
      # se documentan en ms-vehiculos/osv-scanner.toml.
      - name: Escaneo de dependencias (OSV-Scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --config=./ms-vehiculos/osv-scanner.toml
            --recursive
            ./ms-vehiculos

  # ---------------------------------------------------------------------------
  # 2. Contenedor: build de la imagen y publicacion en GHCR
  # ---------------------------------------------------------------------------
  docker:
    name: 2. Imagen Docker
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.short_sha }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.short_sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=sha-${{ steps.vars.outputs.short_sha }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login en GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen
        id: push
        if: github.event_name != 'pull_request'
        run: |
          docker push --all-tags "$IMAGE_NAME"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_NAME}:sha-${{ steps.vars.outputs.short_sha }}" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "## Imagen publicada"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Imagen | \`${IMAGE_NAME}:sha-${{ steps.vars.outputs.short_sha }}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Commit | ${{ github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. Despliegue automatico en entorno simulado "staging" con Docker Compose
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: 3. Deploy staging (Docker Compose)
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: http://localhost:9004/swagger-ui.html
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    env:
      IMAGE: ${{ needs.docker.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Credenciales efimeras generadas en cada ejecucion: nunca quedan en el repo
      - name: Generar .env del entorno
        run: |
          {
            echo "DB_USERNAME=vehiculos"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_PORT=9004"
          } > .env

      - name: Levantar servicios (espera a que esten healthy)
        run: docker compose up -d --no-build --wait --wait-timeout 240

      - name: Pruebas de humo sobre el despliegue
        run: |
          set -e
          BASE=http://localhost:9004
          curl -fsS $BASE/actuator/health | tee /dev/stderr | grep -q '"UP"'
          curl -fsS -X POST $BASE/api/v1/vehiculos -H 'Content-Type: application/json' \
            -d '{"patente":"CICD01","marca":"Toyota","modelo":"Yaris","anio":2022,"color":"Gris","tipo":"Sedan","disponible":true}'
          curl -fsS $BASE/api/v1/vehiculos | grep -q CICD01
          test "$(curl -s -o /dev/null -w '%{http_code}' $BASE/api/v1/vehiculos/99999)" = "404"
          echo "Pruebas de humo OK"

      - name: Estado del entorno
        if: always()
        run: |
          docker compose ps
          docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' $(docker compose ps -q app)

      - name: Logs en caso de fallo
        if: failure()
        run: docker compose logs --no-color

      - name: Bajar entorno
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # 4. Despliegue automatico en "produccion" simulada: cluster Kubernetes (kind)
  # ---------------------------------------------------------------------------
  deploy-production:
    name: 4. Deploy produccion (Kubernetes)
    needs: [docker, deploy-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    env:
      IMAGE: ${{ needs.docker.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Crear cluster Kubernetes (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: vehiculos

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cargar en el cluster la imagen publicada
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name vehiculos

      - name: Instalar metrics-server (necesario para el HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'

      - name: Crear namespace y Secret de base de datos
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n vehiculos create secret generic vehiculos-db \
            --from-literal=DB_USERNAME=vehiculos \
            --from-literal=DB_PASSWORD="$(openssl rand -hex 16)" \
            --from-literal=DB_ROOT_PASSWORD="$(openssl rand -hex 16)"

      - name: Desplegar manifiestos con la imagen de este commit
        run: |
          sed -i "s|newName: .*|newName: ${IMAGE%:*}|; s|newTag: .*|newTag: ${IMAGE##*:}|" k8s/kustomization.yaml
          kubectl apply -k k8s/
          kubectl -n vehiculos annotate deployment ms-vehiculos --overwrite \
            kubernetes.io/change-cause="commit ${GITHUB_SHA} - run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          kubectl -n vehiculos rollout status statefulset/mysql --timeout=300s
          kubectl -n vehiculos rollout status deployment/ms-vehiculos --timeout=300s

      - name: Pruebas de humo en Kubernetes
        run: |
          kubectl -n vehiculos port-forward svc/ms-vehiculos 8080:80 &
          sleep 5
          curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'
          curl -fsS -X POST http://localhost:8080/api/v1/vehiculos -H 'Content-Type: application/json' \
            -d '{"patente":"K8S001","marca":"Kia","modelo":"Rio","anio":2023,"color":"Blanco","tipo":"Hatchback","disponible":true}'
          curl -fsS http://localhost:8080/api/v1/vehiculos | grep -q K8S001
          echo "Pruebas de humo en Kubernetes OK"

      - name: Estado del despliegue
        if: always()
        run: |
          kubectl -n vehiculos get all,hpa,pdb,networkpolicy
          kubectl -n vehiculos rollout history deployment/ms-vehiculos
          {
            echo "## Despliegue en produccion (Kubernetes)"
            echo "- Imagen: \`$IMAGE\`"
            echo "- Digest: \`${{ needs.docker.outputs.digest }}\`"
            echo '```'
            kubectl -n vehiculos get deploy,pods,hpa -o wide
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostico en caso de fallo
        if: failure()
        run: |
          kubectl -n vehiculos describe pods
          kubectl -n vehiculos logs deployment/ms-vehiculos --all-containers --tail=200 || true
          kubectl -n vehiculos get events --sort-by=.lastTimestamp

  # ---------------------------------------------------------------------------
  # 5. Despliegue automatico en la nube: instancia AWS EC2 con Docker Compose.
  #    Solo se ejecuta si la misma imagen ya paso staging y Kubernetes.
  # ---------------------------------------------------------------------------
  deploy-aws:
    name: 5. Deploy AWS EC2
    needs: [docker, deploy-production]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: aws
      url: http://${{ vars.EC2_HOST }}:9004/swagger-ui.html
    env:
      IMAGE: ${{ needs.docker.outputs.image }}
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
      REMOTE_DIR: ms-vehiculos
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.aws.yml
    steps:
      - uses: actions/checkout@v5

      - name: Configurar acceso SSH a la instancia
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::Faltan la variable EC2_HOST o el secret EC2_SSH_KEY (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/ec2.pem -o ConnectTimeout=15 $EC2_USER@$EC2_HOST" >> "$GITHUB_ENV"

      - name: Copiar archivos de despliegue
        run: |
          $SSH "mkdir -p ~/$REMOTE_DIR"
          scp -i ~/.ssh/ec2.pem ms-vehiculos/docker-compose.yml ms-vehiculos/docker-compose.aws.yml \
            "$EC2_USER@$EC2_HOST:~/$REMOTE_DIR/"

      # El .env con las credenciales se genera UNA vez en el servidor y se conserva entre
      # despliegues (el volumen de MySQL guarda la clave con que se inicializo).
      # El login en GHCR usa el token temporal de esta ejecucion y se cierra al terminar.
      - name: Desplegar imagen del commit en la instancia
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $SSH bash -s <<EOF
          set -e
          cd ~/$REMOTE_DIR
          if [ ! -f .env ]; then
            umask 077
            printf 'DB_USERNAME=vehiculos\nDB_PASSWORD=%s\nDB_ROOT_PASSWORD=%s\nAPP_PORT=9004\n' \
              "\$(openssl rand -hex 16)" "\$(openssl rand -hex 16)" > .env
          fi
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export IMAGE="$IMAGE"
          $COMPOSE pull app
          $COMPOSE up -d --no-build --wait --wait-timeout 420
          docker logout ghcr.io
          echo "\$(date -u +%Y-%m-%dT%H:%M:%SZ) $IMAGE ${GITHUB_SHA} run=${GITHUB_RUN_ID}" >> deployments.log
          docker image prune -af >/dev/null   # disco pequeno: borra imagenes de despliegues anteriores
          EOF

      - name: Pruebas de humo en la instancia
        run: |
          $SSH bash -s <<'EOF'
          set -e
          BASE=http://localhost:9004
          curl -fsS $BASE/actuator/health | grep -q '"UP"'
          curl -fsS $BASE/api/v1/vehiculos > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' $BASE/api/v1/vehiculos/99999)" = "404"
          echo "Pruebas de humo en AWS OK"
          EOF

      - name: Verificar acceso publico
        continue-on-error: true   # depende de que el Security Group permita el puerto 9004
        run: curl -fsS --max-time 15 "http://$EC2_HOST:9004/actuator/health"

      - name: Estado del despliegue
        if: always()
        run: |
          {
            echo "## Despliegue en AWS EC2"
            echo "- Instancia: \`$EC2_HOST\`"
            echo "- Imagen: \`$IMAGE\`"
            echo "- Digest: \`${{ needs.docker.outputs.digest }}\`"
            echo "- Swagger: http://$EC2_HOST:9004/swagger-ui.html"
            echo '```'
            $SSH "cd ~/$REMOTE_DIR && $COMPOSE ps && echo && tail -5 deployments.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs en caso de fallo
        if: failure()
        run: $SSH "cd ~/$REMOTE_DIR && $COMPOSE logs --no-color --tail=150" || true

  # ---------------------------------------------------------------------------
  # Alerta: si cualquier etapa falla en main, se abre un issue automaticamente
  # ---------------------------------------------------------------------------
  alert:
    name: Alerta de fallo
    needs: [security, docker, deploy-staging, deploy-production, deploy-aws]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = Object.entries(${{ toJSON(needs) }})
              .filter(([, j]) => j.result === 'failure')
              .map(([name]) => `- \`${name}\``)
              .join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline fallido en ${context.sha.substring(0, 7)}`,
              body: `El pipeline CI/CD fallo y el despliegue fue bloqueado.\n\n**Etapas fallidas:**\n${failed}\n\n**Commit:** ${context.sha}\n**Autor:** @${context.actor}\n**Ejecucion:** ${run}`,
              labels: ['pipeline-failure']
            });
