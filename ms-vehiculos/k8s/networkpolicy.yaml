# MySQL solo acepta trafico desde los pods del microservicio
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-solo-desde-app
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ms-vehiculos
      ports:
        - port: 3306
