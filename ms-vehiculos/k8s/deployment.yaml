apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-vehiculos
  labels:
    app: ms-vehiculos
spec:
  replicas: 2
  revisionHistoryLimit: 5            # permite "kubectl rollout undo" a versiones anteriores
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0              # despliegue sin downtime: siempre hay pods sirviendo
      maxSurge: 1
  selector:
    matchLabels:
      app: ms-vehiculos
  template:
    metadata:
      labels:
        app: ms-vehiculos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Reparte las replicas entre nodos cuando hay mas de uno
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ms-vehiculos
      initContainers:
        # Espera a que MySQL acepte conexiones antes de arrancar la app
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo esperando mysql; sleep 3; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
      containers:
        - name: app
          image: ms-vehiculos
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9004
          envFrom:
            - configMapRef:
                name: ms-vehiculos-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: vehiculos-db, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: vehiculos-db, key: DB_PASSWORD }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits:   { cpu: "1",  memory: 768Mi }
          # startupProbe da margen al arranque de Spring; luego toman el control liveness/readiness
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: { seconds: 5 }   # deja que el Service saque el pod antes de apagarlo
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 40
      volumes:
        - name: tmp
          emptyDir: {}
